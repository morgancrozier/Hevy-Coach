name: Hevy report (manual)

# Deliberately opt-in. To schedule, add a UTC cron here after reading AUTOMATION.md.
on:
  workflow_dispatch:
    inputs:
      force_report:
        description: Generate even when the latest workout is already processed
        default: false
        type: boolean
      email:
        description: Deliver by email (requires SMTP secrets)
        default: false
        type: boolean
      ai:
        description: Add OpenAI commentary (uses API credits)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hevy-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Restore duplicate protection
        uses: actions/cache/restore@v4
        with:
          path: .hevy-state/
          key: hevy-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hevy-state-v1-${{ github.ref_name }}-
      - name: Generate and deliver
        id: report
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          REQUEST_EMAIL: ${{ inputs.email }}
          REQUEST_AI: ${{ inputs.ai }}
          FORCE_REPORT: ${{ inputs.force_report }}
        run: |
          args=(both --quiet --state-file .hevy-state/processed.json)
          if [ "$REQUEST_EMAIL" = "true" ]; then args+=(--email); fi
          if [ "$REQUEST_AI" = "true" ]; then args+=(--ai); fi
          if [ "$FORCE_REPORT" = "true" ]; then args+=(--force); fi
          python hevy_stats.py "${args[@]}"
      - name: Save successful duplicate protection
        if: steps.report.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .hevy-state/
          key: hevy-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Reports/raw history are intentionally not uploaded or printed in this workflow.
